<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sneakernet</title>
  <style>
    :root {
      --bg:           #0f1117;
      --surface:      #1a1d27;
      --border:       #2a2d3a;
      --accent:       #4f8ef7;
      --accent-hover: #3a75e0;
      --text:         #e4e6f0;
      --muted:        #8b8fa8;
      --danger:       #e05a5a;
      --ok:           #4caf7d;
      --mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    .hidden { display: none !important; }

    /* ── inputs & buttons ──────────────────────────────── */
    input, textarea, button {
      font-family: inherit;
      font-size: 14px;
      border-radius: 6px;
    }
    input, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      width: 100%;
      transition: border-color .15s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    button {
      background: var(--accent);
      border: none;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
      padding: 8px 14px;
      transition: background .15s, opacity .15s;
      white-space: nowrap;
    }
    button:hover  { background: var(--accent-hover); }
    button:disabled { opacity: .4; cursor: default; }

    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.ghost:hover { background: var(--surface); }

    button.sm { padding: 5px 10px; font-size: 12px; }

    /* ── lock screen ───────────────────────────────────── */
    #lock-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lock-card h1 { font-size: 20px; margin-bottom: 4px; }
    .lock-card .sub { color: var(--muted); font-size: 12px; margin-top: -4px; margin-bottom: 6px; }
    #lock-err { color: var(--danger); font-size: 12px; min-height: 16px; }

    /* ── app shell ─────────────────────────────────────── */
    #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 { flex: 1; font-size: 15px; }

    .app-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      overflow: hidden;
    }

    /* ── inbox panel ───────────────────────────────────── */
    #inbox-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .panel-hdr {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .panel-hdr h2 {
      flex: 1;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }
    #msg-list { flex: 1; overflow-y: auto; }

    .msg-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .msg-item:hover { background: var(--surface); }
    .msg-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .msg-body { line-height: 1.55; word-break: break-word; white-space: pre-wrap; }

    .empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── right column ──────────────────────────────────── */
    #right-col {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }

    /* ── identities ────────────────────────────────────── */
    .id-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .id-name { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
    .id-key {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      word-break: break-all;
      cursor: pointer;
      line-height: 1.4;
    }
    .id-key:hover { color: var(--accent); }

    .row { display: flex; gap: 6px; }
    .row input { flex: 1; }

    /* ── status bar ────────────────────────────────────── */
    #statusbar {
      font-size: 11px;
      color: var(--muted);
      padding: 5px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    #statusbar.ok  { color: var(--ok); }
    #statusbar.err { color: var(--danger); }

    /* ── toast ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* ── mobile ────────────────────────────────────────── */
    @media (max-width: 600px) {
      .app-body {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
        overflow-y: auto;
      }
      #inbox-panel {
        border-right: none;
        min-height: 40dvh;
      }
      #right-col { overflow-y: visible; }
    }
  </style>
</head>
<body>

<!-- ── lock screen ─────────────────────────────────────────── -->
<div id="lock-screen">
  <div class="lock-card">
    <h1>Sneakernet</h1>
    <p class="sub">Anonymous messaging</p>
    <input type="password" id="pw" placeholder="Password"
           onkeydown="if(event.key==='Enter')unlock()">
    <button onclick="unlock()">Unlock</button>
    <button class="ghost" onclick="createAndUnlock()">Create new keystore</button>
    <p id="lock-err"></p>
  </div>
</div>

<!-- ── main app ────────────────────────────────────────────── -->
<div id="app" class="hidden">

  <header>
    <h1>Sneakernet</h1>
    <button class="ghost sm" id="scrape-btn" onclick="scrape()">Refresh inbox</button>
    <button class="ghost sm" onclick="lock()">Lock</button>
  </header>

  <div class="app-body">

    <!-- inbox -->
    <div id="inbox-panel">
      <div class="panel-hdr">
        <h2>Inbox</h2>
        <span id="msg-count" style="font-size:11px;color:var(--muted)"></span>
      </div>
      <div id="msg-list">
        <div class="empty">No messages yet — hit Refresh to scan new blocks.</div>
      </div>
    </div>

    <!-- right column -->
    <div id="right-col">

      <!-- compose -->
      <div class="section">
        <h2>Compose</h2>
        <input id="recipient" placeholder="Recipient public key (base64)"
               style="font-family:var(--mono);font-size:11px">
        <textarea id="msg-body" placeholder="Message…"></textarea>
        <button id="send-btn" onclick="send()">Send</button>
      </div>

      <!-- identities -->
      <div class="section" style="flex:1">
        <h2>Your identities</h2>
        <div id="id-list"></div>
        <div class="row">
          <input id="new-id-name" placeholder="Identity name"
                 onkeydown="if(event.key==='Enter')addIdentity()">
          <button class="sm" onclick="addIdentity()">Add</button>
        </div>
      </div>

    </div>
  </div>

  <div id="statusbar">Ready</div>
</div>

<div id="toast"></div>

<script>
// ── state ──────────────────────────────────────────────────────────────
let token   = sessionStorage.getItem('snk_token');
let lastID  = 0;
let msgCount = 0;

// ── boot ───────────────────────────────────────────────────────────────
(async () => {
  if (token) {
    const r = await fetch('/api/identities', {headers: hdrs()});
    if (r.ok) { showApp(); return; }
  }
  token = null;
  sessionStorage.removeItem('snk_token');
  showLock();
})();

// ── api helper ─────────────────────────────────────────────────────────
function hdrs(withBody = false) {
  const h = {};
  if (token) h['Authorization'] = 'Bearer ' + token;
  if (withBody) h['Content-Type'] = 'application/json';
  return h;
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: hdrs(body !== undefined),
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    token = null;
    sessionStorage.removeItem('snk_token');
    showLock();
    lockErr('Session expired — please unlock again.');
    return null;
  }
  return r;
}

// ── auth ───────────────────────────────────────────────────────────────
async function unlock() {
  const pw = el('pw').value;
  if (!pw) return;
  lockErr('');
  const r = await api('POST', '/api/unlock', {password: pw});
  if (!r) return;
  if (r.status === 404) { lockErr('No keystore found — create one first.'); return; }
  if (!r.ok)            { lockErr('Wrong password or corrupted keystore.'); return; }
  token = (await r.json()).token;
  sessionStorage.setItem('snk_token', token);
  el('pw').value = '';
  showApp();
}

async function createAndUnlock() {
  const pw = el('pw').value;
  if (!pw) { lockErr('Enter a password first.'); return; }
  lockErr('');
  const r = await api('POST', '/api/keystore/create', {password: pw});
  if (!r) return;
  if (r.status === 409) { lockErr('Keystore already exists — just unlock it.'); return; }
  if (!r.ok)            { lockErr('Failed to create keystore.'); return; }
  await unlock();
}

async function lock() {
  await api('POST', '/api/lock');
  token = null;
  sessionStorage.removeItem('snk_token');
  lastID = 0; msgCount = 0;
  showLock();
}

// ── scrape ─────────────────────────────────────────────────────────────
async function scrape() {
  const btn = el('scrape-btn');
  btn.disabled = true;
  btn.textContent = 'Scanning…';
  status('Scanning blocks…');
  try {
    const r = await api('POST', '/api/scrape');
    if (!r) return;
    const {found} = await r.json();
    status(`Scan complete — ${found} new message${found === 1 ? '' : 's'}.`, found > 0 ? 'ok' : '');
    if (found > 0) await loadMessages();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh inbox';
  }
}

// ── messages ───────────────────────────────────────────────────────────
async function loadMessages() {
  const r = await api('GET', `/api/messages?after_id=${lastID}`);
  if (!r || !r.ok) return;
  const msgs = await r.json();
  if (!msgs?.length) return;

  const list = el('msg-list');
  list.querySelector('.empty')?.remove();

  msgs.forEach(m => {
    const content = b64toText(m.content);
    const div = document.createElement('div');
    div.className = 'msg-item';
    div.innerHTML =
      `<div class="msg-meta">${esc(fmtTime(m.received_at))} &nbsp;·&nbsp; ${m.block_id.slice(0,12)}…</div>` +
      `<div class="msg-body">${esc(content)}</div>`;
    list.appendChild(div);
    if (m.id > lastID) lastID = m.id;
    msgCount++;
  });

  el('msg-count').textContent = `${msgCount} message${msgCount === 1 ? '' : 's'}`;
}

// ── compose ────────────────────────────────────────────────────────────
async function send() {
  const recipientKey = el('recipient').value.trim();
  const body = el('msg-body').value;
  if (!recipientKey || !body) { toast('Fill in recipient key and message.'); return; }

  const btn = el('send-btn');
  btn.disabled = true;
  try {
    const r = await api('POST', '/api/send', {recipient_public_key: recipientKey, message: body});
    if (!r) return;
    if (!r.ok) { const d = await r.json(); toast('Send failed: ' + d.error, true); return; }
    el('msg-body').value = '';
    toast('Message sent.');
    status('Message stored in blockstore.');
  } finally {
    btn.disabled = false;
  }
}

// ── identities ─────────────────────────────────────────────────────────
async function loadIdentities() {
  const r = await api('GET', '/api/identities');
  if (!r || !r.ok) return;
  const ids = await r.json();
  const list = el('id-list');
  list.innerHTML = '';
  if (!ids?.length) {
    list.innerHTML = '<p style="color:var(--muted);font-size:12px;margin-bottom:4px">No identities yet — add one to receive messages.</p>';
    return;
  }
  ids.forEach(id => {
    const div = document.createElement('div');
    div.className = 'id-item';
    div.innerHTML =
      `<div class="id-name">${esc(id.name)}</div>` +
      `<div class="id-key" title="Click to copy public key" onclick="copyKey('${esc(id.public_key)}')">${esc(id.public_key)}</div>`;
    list.appendChild(div);
  });
}

async function addIdentity() {
  const name = el('new-id-name').value.trim();
  if (!name) return;
  const r = await api('POST', '/api/identities', {name});
  if (!r) return;
  if (r.status === 409) { toast('That name is already taken.', true); return; }
  if (!r.ok)            { toast('Failed to add identity.', true); return; }
  el('new-id-name').value = '';
  await loadIdentities();
  toast(`Identity "${name}" created.`);
}

async function copyKey(key) {
  await navigator.clipboard.writeText(key);
  toast('Public key copied to clipboard.');
}

// ── view transitions ───────────────────────────────────────────────────
function showLock() {
  el('lock-screen').classList.remove('hidden');
  el('app').classList.add('hidden');
  el('pw').focus();
}

async function showApp() {
  el('lock-screen').classList.add('hidden');
  el('app').classList.remove('hidden');
  await Promise.all([loadMessages(), loadIdentities()]);
  status('Ready');
}

// ── helpers ────────────────────────────────────────────────────────────
const el = id => document.getElementById(id);

function lockErr(msg) { el('lock-err').textContent = msg; }

function status(msg, cls = '') {
  const s = el('statusbar');
  s.textContent = msg;
  s.className = cls;
}

let toastTimer;
function toast(msg, err = false) {
  const t = el('toast');
  t.textContent = msg;
  t.style.borderColor = err ? 'var(--danger)' : 'var(--border)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Decode base64 → UTF-8 text. Falls back gracefully for binary payloads.
function b64toText(b64) {
  try {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    return new TextDecoder('utf-8', {fatal: true}).decode(bytes);
  } catch {
    return '[binary content]';
  }
}
</script>
</body>
</html>
